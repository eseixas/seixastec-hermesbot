  <path d="M372 180 C422 140, 442 80, 362 70 C352 110, 332 140, 292 160 Z" fill="#38bdf8" opacity="0.85" />
  <path d="M392 220 C452 200, 462 140, 392 130 C377 160, 352 185, 317 200 Z" fill="#60a5fa" opacity="0.85" />

  <!-- Center Core Indicator Dot -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" />
  <circle cx="256" cy="256" r="16" fill="#0284c7" />
  
  <!-- Bottom Neural Connection nodes -->
  <circle cx="256" cy="400" r="12" fill="#38bdf8" />
  <circle cx="190" cy="360" r="8" fill="#818cf8" />
  <circle cx="322" cy="360" r="8" fill="#818cf8" />
